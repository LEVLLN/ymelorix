[package]
name = "ymelorix"
version = "0.1.0"
edition = "2024"
# Проверено на toolchain, а не выведено на глаз: на 1.90 не собирается
# `Duration::from_mins`. Тот же номер стоит в матрице CI.
rust-version = "1.91"
authors = ["Lev Kudryashov <lev.kudryashov1994@gmail.com>"]
license = "MIT"
description = "Консольный загрузчик избранного из Яндекс Музыки"
readme = "README.md"
repository = "https://github.com/LEVLLN/ymelorix"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
yandex-music = "0.7.0"

[dev-dependencies]
rstest = "0.26.1"

[lints.rust]
# Бинарный крейт не имеет внешних потребителей: `pub` здесь ничего не значит,
# и компилятор сам сводит косметический `pub` к `pub(crate)`.
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
fallible_impl_from = "deny"
match_same_arms = "deny"
match_wildcard_for_single_variants = "deny"
if_not_else = "deny"
needless_continue = "deny"
explicit_iter_loop = "deny"
explicit_into_iter_loop = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
clone_on_copy = "deny"
undocumented_unsafe_blocks = "deny"
